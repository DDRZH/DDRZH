<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | ddrzh.com</title>
    <meta
      name="description"
      content="The page you are looking for does not exist. Return to ddrzh.com to explore AI systems, websites, apps and tailored software."
    />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#081111" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        --ink: #071211;
        --surface: #f7faf8;
        --muted: #60706d;
        --teal: #007f78;
        --mint: #9cf2c8;
        --lime: #d7ff6a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background:
          radial-gradient(circle at 78% 18%, rgba(0, 127, 120, 0.18), transparent 52%),
          radial-gradient(circle at 12% 88%, rgba(156, 242, 200, 0.22), transparent 46%),
          var(--surface);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      .panel {
        width: min(100%, 640px);
        padding: clamp(32px, 6vw, 56px);
        border: 1px solid rgba(7, 18, 17, 0.1);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 18px 60px rgba(7, 18, 17, 0.12);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        text-decoration: none;
        color: var(--ink);
      }
      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid rgba(0, 127, 120, 0.3);
        border-radius: 8px;
        background: rgba(0, 127, 120, 0.08);
        color: var(--teal);
      }
      .code {
        margin: 40px 0 8px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--teal);
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(32px, 5vw, 46px);
        line-height: 1.08;
        letter-spacing: -0.03em;
      }
      p { margin: 0 0 28px; color: var(--muted); font-size: 17px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 22px;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
      }
      .button-primary { background: var(--ink); color: var(--lime); }
      .button-secondary {
        border: 1px solid rgba(7, 18, 17, 0.18);
        color: var(--ink);
        background: transparent;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span>ddrzh.com</span>
      </a>
      <p class="code">404 · Page not found</p>
      <h1>This page is not part of the system.</h1>
      <p>
        The link may be outdated or mistyped. Head back to the homepage to explore AI systems, websites, apps and
        tailored software.
      </p>
      <div class="actions">
        <a class="button button-primary" href="/">Back to homepage</a>
        <a class="button button-secondary" href="/#case-studies">See case studies</a>
      </div>
    </main>
  </body>
</html>
