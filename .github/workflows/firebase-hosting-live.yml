# Deploys the GitHub main branch to Firebase Hosting.
name: Deploy Firebase Hosting Live

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether Functions changed
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            DEPLOY_FUNCTIONS=true
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- functions-renclone firebase.json; then
            DEPLOY_FUNCTIONS=false
          else
            DEPLOY_FUNCTIONS=true
          fi
          echo "deploy_functions=$DEPLOY_FUNCTIONS" >> "$GITHUB_OUTPUT"
          echo "Deploy Functions: $DEPLOY_FUNCTIONS"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Functions dependencies
        if: steps.scope.outputs.deploy_functions == 'true'
        run: npm ci
        working-directory: functions-renclone

      - name: Write service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DDRZH_31CB8 }}
        run: |
          if [[ -z "$FIREBASE_SA" ]]; then
            echo "::error::Firebase service account secret is missing."
            exit 1
          fi
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Set up Google Cloud CLI
        if: steps.scope.outputs.deploy_functions == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy renclone functions
        if: steps.scope.outputs.deploy_functions == 'true'
        run: |
          set +e
          LOG="$RUNNER_TEMP/firebase-functions-deploy.log"
          ATTEMPTS=5
          for i in $(seq 1 $ATTEMPTS); do
            echo "::group::Functions deploy attempt $i/$ATTEMPTS"
            npx --yes firebase-tools@latest deploy --only functions:renclone,functions:renCloneLive --project ddrzh-31cb8 --non-interactive --force --debug 2>&1 | tee "$LOG"
            STATUS=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            if grep -q "unable to queue the operation" "$LOG"; then
              if [ "$i" -lt "$ATTEMPTS" ]; then
                echo "::warning::Function update is already in progress; retrying after 20s."
                sleep 20
                continue
              fi
            fi
            exit $STATUS
          done
          exit $STATUS

      - name: Wait for renclone functions to become active
        if: steps.scope.outputs.deploy_functions == 'true'
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          for i in $(seq 1 30); do
            renclone_state="$(gcloud functions describe renclone --gen2 --region us-central1 --project ddrzh-31cb8 --format='value(state)' 2>/tmp/renclone-describe-error.log || true)"
            renCloneLive_state="$(gcloud functions describe renCloneLive --gen2 --region us-central1 --project ddrzh-31cb8 --format='value(state)' 2>/tmp/renCloneLive-describe-error.log || true)"
            echo "renclone state: ${renclone_state:-unavailable}, renCloneLive state: ${renCloneLive_state:-unavailable} (attempt $i/30)"
            if [ "$renclone_state" = "ACTIVE" ] && [ "$renCloneLive_state" = "ACTIVE" ]; then
              exit 0
            fi
            if [ "$renclone_state" = "FAILED" ] || [ "$renclone_state" = "UNKNOWN" ] || [ "$renCloneLive_state" = "FAILED" ] || [ "$renCloneLive_state" = "UNKNOWN" ]; then
              cat /tmp/renclone-describe-error.log || true
              cat /tmp/renCloneLive-describe-error.log || true
              exit 1
            fi
            sleep 10
          done
          echo "::error::renclone functions did not become ACTIVE before Hosting deploy."
          gcloud functions describe renclone --gen2 --region us-central1 --project ddrzh-31cb8 || true
          gcloud functions describe renCloneLive --gen2 --region us-central1 --project ddrzh-31cb8 || true
          exit 1

      - name: Deploy Firebase Hosting
        run: |
          set +e
          LOG="$RUNNER_TEMP/firebase-hosting-deploy.log"
          ATTEMPTS=3
          for i in $(seq 1 $ATTEMPTS); do
            echo "::group::Hosting deploy attempt $i/$ATTEMPTS"
            npx --yes firebase-tools@latest deploy --only hosting --project ddrzh-31cb8 --non-interactive --force --debug 2>&1 | tee "$LOG"
            STATUS=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            if grep -q "is the current active version" "$LOG"; then
              echo "::notice::Hosting content unchanged since last deploy; treating as success."
              exit 0
            fi
            if grep -q "content hash doesn't match content" "$LOG" || grep -q "Requested entity was not found" "$LOG"; then
              if [ "$i" -lt "$ATTEMPTS" ]; then
                echo "::warning::Transient Hosting deploy error on attempt $i; retrying after 15s."
                sleep 15
                continue
              fi
            fi
            exit $STATUS
          done
          exit $STATUS
