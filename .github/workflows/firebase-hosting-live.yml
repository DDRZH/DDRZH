# Deploys the GitHub main branch to Firebase Hosting.
name: Deploy Firebase Hosting Live

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions-renclone

      - name: Write service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DDRZH_31CB8 }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy Firebase Hosting
        run: |
          set +e
          LOG="$RUNNER_TEMP/firebase-hosting-deploy.log"
          ATTEMPTS=3
          for i in $(seq 1 $ATTEMPTS); do
            echo "::group::Hosting deploy attempt $i/$ATTEMPTS"
            npx --yes firebase-tools@latest deploy --only hosting --project ddrzh-31cb8 --non-interactive --force --debug 2>&1 | tee "$LOG"
            STATUS=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            if grep -q "is the current active version" "$LOG"; then
              echo "::notice::Hosting content unchanged since last deploy; treating as success."
              exit 0
            fi
            if grep -q "content hash doesn't match content" "$LOG"; then
              if [ "$i" -lt "$ATTEMPTS" ]; then
                echo "::warning::hash-mismatch on attempt $i; retrying after 15s."
                sleep 15
                continue
              fi
            fi
            exit $STATUS
          done
          exit $STATUS

      - name: Deploy renClone function
        run: |
          set +e
          LOG="$RUNNER_TEMP/firebase-functions-deploy.log"
          ATTEMPTS=5
          for i in $(seq 1 $ATTEMPTS); do
            echo "::group::Functions deploy attempt $i/$ATTEMPTS"
            npx --yes firebase-tools@latest deploy --only functions:renClone --project ddrzh-31cb8 --non-interactive --force --debug 2>&1 | tee "$LOG"
            STATUS=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            if grep -q "unable to queue the operation" "$LOG"; then
              if [ "$i" -lt "$ATTEMPTS" ]; then
                echo "::warning::Function update is already in progress; retrying after 20s."
                sleep 20
                continue
              fi
            fi
            exit $STATUS
          done
          exit $STATUS
